version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: jewel_erp_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: jewel_erp
      POSTGRES_USER: jewel_user
      POSTGRES_PASSWORD: jewel_pass_2024
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jewel_user -d jewel_erp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
    name: jewel_erp_postgres_data
